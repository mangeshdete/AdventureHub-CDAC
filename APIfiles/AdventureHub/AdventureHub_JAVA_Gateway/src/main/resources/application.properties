spring.application.name=p14Gateway
server.port=8140

eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:8141/eureka

spring.web.cors.allowed-origins=http://localhost:3014
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,Accept
spring.web.cors.allow-credentials=true